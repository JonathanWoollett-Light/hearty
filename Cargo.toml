[package]
name = "hearty"
version = "0.2.0"
edition = "2024"
# The oldest Rust that builds the binary (`cargo install hearty`), checked by
# the MSRV job in ci.yml. Several dependencies need 1.88.
rust-version = "1.88"
description = "Check HOI4 mod files for missing localisations"
license = "MIT"
repository = "https://github.com/JonathanWoollett-Light/hearty"
keywords = ["hoi4", "localisation", "mod"]
categories = ["command-line-utilities"]
# Read on GitHub, not needed to build or test: the docs (the README's charts,
# the rules site, the development guide) and the chart script.
exclude = ["docs/", "scripts/"]

[dependencies]
walkdir = "2.5.0"
rayon = "1.12.0"
jomini = { version = "0.37.1", features = ["envelope"] }
clap = { version = "4", features = ["derive"] }
displaydoc = "0.2.7"
miette = { version = "7", features = ["fancy"] }
thiserror = "2.0.21"
semver = "1.0.28"
keyvalues-parser = "0.2.4"
serde_json = "1.0.151"
ureq = "3.4.2"
zip = { version = "8", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4.46"
similar = "3.2.0"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry"] }
inferno = { version = "0.12.8", default-features = false }
mimalloc = { version = "0.1.52", default-features = false }

[dev-dependencies]
dasher = "0.3.3"
base64 = "0.23.1"
tempfile = "3.27.0"
copy_dir = "0.1.3"

[[bench]]
name = "millennium_dawn"
harness = false

[[bench]]
name = "workshop_mods"
harness = false
