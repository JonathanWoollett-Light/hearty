name: commitlint

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

# A new push to a pull request cancels the run for its previous push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # list the pull request's commits
    steps:
      # Only for .commitlintrc.yml: the action reads the commits from the API.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every commit in the pull request, against .commitlintrc.yml
      # (@commitlint/config-conventional), which the action's image includes.
      # The SHA pins the action, but it runs the Docker Hub image tagged 6.2.1,
      # which could be re-pushed. Accepted: this job can only read.
      - name: Check commit messages
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        with:
          configFile: .commitlintrc.yml
