name: release-plz

on:
  push:
    branches:
      - master

permissions: {}

# Rust comes from rustup, which the runners have. As dtolnay/rust-toolchain did:
# coloured cargo output, no incremental builds (each run starts from scratch),
# and rustup may copy a file it can't move across filesystems.
env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUSTUP_PERMIT_COPY_RENAME: 1

jobs:
  release-plz:
    name: Release-plz
    runs-on: ubuntu-latest
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write # create the release tag and GitHub release; push the release PR's branch
      id-token: write # crates.io trusted publishing (OIDC)
      pull-requests: write # open and update the release PR
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      releases: ${{ steps.release.outputs.releases }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # `install` also updates the runner's stable to the newest release.
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
          rustup default stable

      - name: cargo check
        run: cargo check

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy -- --deny warnings

      - name: cargo test
        run: cargo test

      # Runs first: tags the commit and creates a GitHub release if the
      # release PR was just merged.
      - name: release-plz release
        id: release
        uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5.139
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No CARGO_REGISTRY_TOKEN needed — crates.io trusted publishing
          # exchanges the OIDC token (id-token: write above) automatically.

      # Runs second: opens or updates a release PR with changelog and
      # version bump whenever new commits land on master.
      - name: release-plz release-pr
        uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5.139
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-binaries:
    name: Build ${{ matrix.target }}
    needs: release-plz
    if: needs.release-plz.outputs.releases_created == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # upload the binaries to the GitHub release
    # Scripts read these from the environment: an expression expanded into a
    # script's text could inject code into it.
    env:
      RELEASE_TAG: ${{ fromJson(needs.release-plz.outputs.releases)[0].tag }}
      TARGET: ${{ matrix.target }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Install Rust (stable)
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target "$TARGET" --no-self-update
          rustup default stable

      - name: Build
        shell: bash
        run: cargo build --release --target "$TARGET"

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: tar czf hearty-x86_64-linux.tar.gz -C "target/$TARGET/release" hearty

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Compress-Archive -Path "target\$env:TARGET\release\hearty.exe" -DestinationPath hearty-x86_64-windows.zip

      - name: Upload (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: gh release upload "$RELEASE_TAG" hearty-x86_64-linux.tar.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload (Windows)
        if: matrix.os == 'windows-latest'
        run: gh release upload "$env:RELEASE_TAG" hearty-x86_64-windows.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
