version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Only propose a release once it's a week old: a broken or compromised
    # release is usually yanked within days, and these are merged
    # automatically (dependabot-auto-merge.yml).
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
    groups:
      dependencies:
        patterns:
          - "*"

  # Actions are pinned to commit SHAs; Dependabot updates the SHA and the
  # version in the comment after it. It skips docker:// images, so the
  # actionlint image in ci.yml is updated by hand.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
    groups:
      actions:
        patterns:
          - "*"
